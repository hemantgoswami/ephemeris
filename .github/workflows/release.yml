name: Release

# Merging to main is the release. Every push to main is checked: if the
# version in package.json is not on npm yet, it is linted, tested, published,
# and tagged with a GitHub Release whose notes come from the README changelog.
# A push that does not change the version does nothing and passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases overlap, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # Creating the tag and the GitHub Release.
      contents: write
      # Required for npm trusted publishing. Without it npm cannot mint the
      # short lived registry token and the publish fails.
      id-token: write

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          # Tags, so the test that every released version has a changelog
          # entry has something to compare against.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Active LTS. It ships npm 11.17 and up, comfortably past the
          # 11.5.1 that npm trusted publishing needs, so there is nothing to
          # upgrade here. Lowering this below Node 24 would bring back that
          # requirement.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Decide whether this commit is a release
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # An unpublished package has no versions document, hence the fallback.
          npm view "$name" versions --json > published-versions.json 2>/dev/null \
            || echo '[]' > published-versions.json
          exists="$(node -p "[].concat(require('./published-versions.json')).includes('${version}')")"
          rm published-versions.json

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ "$exists" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on npm. Nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${name}@${version}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: yarn install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.publish == 'true'
        run: yarn run lint

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: yarn run test

      - name: Show what would ship
        if: steps.check.outputs.publish == 'true'
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN here on purpose. npm reads the OIDC token that
      # id-token: write provides, exchanges it for a short lived registry
      # token, and attaches a provenance attestation on its own.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      # After the publish, so a tag only ever exists for a version that
      # actually shipped. gh creates the tag as part of the release.
      - name: Tag and create the GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          node .github/release-notes.js "$VERSION" > release-notes.md
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
          rm release-notes.md
