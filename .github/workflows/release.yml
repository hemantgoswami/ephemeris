name: Release

# Publishing happens when a GitHub Release is published. Cut the release
# against a tag named after the version in package.json, for example v2.3.0.
#
# Running the workflow by hand does everything except the publish, so you can
# check a version builds and packs cleanly before cutting the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing. Without it npm cannot mint the
      # short lived registry token and the publish falls back to asking for
      # credentials that are not there.
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm 11.5.1 or newer, which in turn
          # needs Node 20.17 or 22.9 and up.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Use an npm that can do trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Test
        run: yarn run test

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag ${TAG} does not match package.json version ${version}." >&2
            echo "Fix one of the two, delete the release and cut it again." >&2
            exit 1
          fi
          echo "Releasing version ${version} from tag ${TAG}."

      - name: Refuse to republish a version already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          npm view "$name" versions --json > published-versions.json
          exists="$(node -p "[].concat(require('./published-versions.json')).includes('${version}')")"
          rm published-versions.json
          if [ "$exists" = "true" ]; then
            echo "${name}@${version} is already on npm. Bump the version first." >&2
            exit 1
          fi

      - name: Pack and show what would ship
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN here on purpose. npm reads the OIDC token that
      # id-token: write provides, exchanges it for a short lived registry
      # token, and attaches a provenance attestation on its own.
      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --access public
