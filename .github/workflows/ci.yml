name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # --frozen-lockfile also fails when package.json and yarn.lock have
      # drifted apart, which is worth catching on its own.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Check what would ship to npm
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Current LTS lines plus the one after. The library itself is ES5 and
        # package.json claims Node 14 and up, but ESLint 9 needs 18.18 and
        # up, so the matrix starts at the oldest line still getting fixes.
        node: [20, 22, 24]

    name: test on node ${{ matrix.node }}

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # This is the script a contributor runs, so run it whole. Its pretest
      # hook lints again, which is a couple of seconds well spent to keep CI
      # and local behaviour identical.
      - name: Test
        run: yarn run test
