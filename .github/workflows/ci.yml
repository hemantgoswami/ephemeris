name: CI

on:
  # No branch filter on pull_request on purpose: every pull request gets
  # checked whatever it targets, so renaming the default branch cannot
  # silently switch CI off.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          # Tags, so the test that every released version has a changelog
          # entry has something to compare against.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # --frozen-lockfile also fails when package.json and yarn.lock have
      # drifted apart, which is worth catching on its own.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Check what would ship to npm
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is maintenance LTS until April 2027, 24 is active LTS until
        # April 2028, and 26 becomes LTS in October 2026. Node 20 was dropped
        # when it went end of life on 30 April 2026.
        node: [22, 24, 26]

    name: test on node ${{ matrix.node }}

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          # Tags, so the test that every released version has a changelog
          # entry has something to compare against.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # This is the script a contributor runs, so run it whole. Its pretest
      # hook lints again, which is a couple of seconds well spent to keep CI
      # and local behaviour identical.
      - name: Test
        run: yarn run test
